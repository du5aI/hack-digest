# Собирает свежий снимок хакатонов и публикует Mini App на GitHub Pages.
# Один раз включите: Settings → Pages → Source: GitHub Actions.
name: Mini App

on:
  push:
    branches: [main]
    paths: ["webapp/**", "hackdigest/**", ".github/workflows/webapp.yml"]
  schedule:
    - cron: "17 */3 * * *"  # каждые 3 часа
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Снимок событий
        run: python -m hackdigest.export webapp/data.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
