<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hack Digest: табло</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;800&family=Unbounded:wght@600;800&display=swap">
<style>
  /* Ночной терминал: табло вылетов (тёмное, янтарь) + бумажные посадочные талоны.
     Один осознанный тёмный образ — как у самого табло в чате. */
  :root {
    color-scheme: dark;
    --bg: #0e0f0f;
    --tile: #1b1d1d;
    --tile-hi: #222525;
    --seam: #060707;
    --text: #ece7da;
    --dim: #8a887f;
    --amber: #ffb52e;
    --green: #5bd38a;
    --red: #ff5a3c;
    --paper: #f2ede1;
    --ink: #17171a;
    --spot: #e8432b;
    --rule: #cfc8b7;
    --mute: #7a766c;
    --display: "Unbounded", "Golos Text", system-ui, sans-serif;
    --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--body); }
  body { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .wrap { max-width: 560px; margin: 0 auto; }

  /* ---------- шапка ---------- */
  header { padding: 14px 16px 6px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; gap: 2px; margin-bottom: 6px; }
  .brand i { font: 800 13px/1 var(--mono); font-style: normal; color: var(--amber); width: 15px; height: 20px; display: grid; place-items: center;
    border-radius: 3px; background: linear-gradient(var(--tile-hi) 0 50%, var(--tile) 50% 100%); position: relative; }
  .brand i::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--seam); }
  .brand i.gap { background: none; width: 6px; }
  .clock { font: 500 12px/1 var(--mono); color: var(--dim); letter-spacing: .06em; }
  .mine { display: inline-flex; align-items: center; gap: 6px; font: 500 13px/1 var(--mono); color: var(--dim);
    padding: 7px 10px; border-radius: 8px; background: var(--tile); }
  .mine[aria-pressed="true"] { color: var(--bg); background: var(--amber); }
  .mine b { font-weight: 800; }

  /* ---------- «Горит»: карусель талонов ---------- */
  .hot-head { padding: 12px 16px 10px; display: flex; align-items: baseline; justify-content: space-between; }
  .hot-head h2 { margin: 0; font: 800 20px/1.1 var(--display); letter-spacing: -.01em; }
  .hot-head h2 span { color: var(--red); }
  .hot-head small { font: 500 12px var(--mono); color: var(--dim); }
  .rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 16px 16px;
    scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .pass { flex: 0 0 82%; max-width: 380px; scroll-snap-align: center; background: var(--paper); color: var(--ink);
    border-radius: 14px; display: grid; grid-template-columns: 1fr 92px; position: relative; text-align: left;
    box-shadow: 0 10px 30px rgba(0,0,0,.45); overflow: hidden; }
  .pass::before, .pass::after { content: ""; position: absolute; left: calc(100% - 92px - 9px); width: 18px; height: 18px;
    border-radius: 50%; background: var(--bg); }
  .pass::before { top: -9px; } .pass::after { bottom: -9px; }
  .pass .main { padding: 0 14px 14px; min-width: 0; }
  .strip { grid-column: 1 / -1; background: var(--spot); color: #fff; font: 800 10px/1 var(--mono); letter-spacing: .12em;
    padding: 8px 14px; display: flex; justify-content: space-between; }
  .pass h3 { margin: 12px 0 10px; font: 800 17px/1.15 var(--display); letter-spacing: -.01em; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.3em; }
  .route { display: inline-grid; grid-template-columns: auto auto auto; column-gap: 8px; align-items: center; font: 800 20px/1 var(--display); }
  .route i { color: var(--spot); font-style: normal; font-size: 14px; }
  .route small { font: 500 9px var(--mono); color: var(--mute); letter-spacing: .1em; margin-top: 5px; }
  .pass .tags { margin-top: 10px; font: 800 9px/1.3 var(--mono); color: var(--spot); letter-spacing: .08em; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stub { border-left: 2px dashed var(--rule); padding: 10px 10px 12px; display: flex; flex-direction: column; justify-content: space-between; }
  .stub .k { font: 500 8.5px/1.2 var(--mono); color: var(--mute); letter-spacing: .08em; text-transform: uppercase; }
  .big { font: 800 44px/0.9 var(--display); color: var(--spot); letter-spacing: -.03em; }
  .big + span { font: 600 12px var(--body); }
  .bars { height: 26px; background: repeating-linear-gradient(90deg, var(--ink) 0 var(--a,2px), transparent 0 var(--b,4px)); opacity: .9; }

  /* ---------- фильтры ---------- */
  .filters { position: sticky; top: 0; z-index: 5; background: linear-gradient(var(--bg) 82%, transparent); padding: 10px 0 12px; }
  .seg { margin: 0 16px 10px; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--tile); border-radius: 10px; padding: 3px; }
  .seg button { padding: 7px 4px; border-radius: 8px; font: 500 12.5px var(--body); color: var(--dim); }
  .seg button[aria-pressed="true"] { background: var(--tile-hi); color: var(--text); box-shadow: 0 1px 0 rgba(255,255,255,.06) inset; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; padding: 7px 12px; border-radius: 999px; border: 1px solid #2c2f2f; font: 500 13px var(--body); color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: var(--bg); }
  .chip em { font-style: normal; color: var(--dim); margin-left: 4px; font-size: 12px; }
  .chip[aria-pressed="true"] em { color: rgba(14,15,15,.6); }

  /* ---------- табло ---------- */
  .board { padding: 0 12px; }
  .group { margin: 16px 4px 8px; display: flex; align-items: center; gap: 10px; font: 800 11px var(--mono); letter-spacing: .16em; color: var(--amber); }
  .group::after { content: ""; flex: 1; height: 1px; background: #262929; }
  .group span { color: var(--dim); font-weight: 500; letter-spacing: .06em; }
  .row { width: 100%; display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; text-align: left;
    background: linear-gradient(var(--tile-hi) 0 50%, var(--tile) 50% 100%); border-radius: 8px; padding: 10px 10px;
    margin-bottom: 6px; position: relative; transform-origin: 50% 0; }
  .row::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--seam); opacity: .7; }
  .row:active { filter: brightness(1.15); }
  .d { font: 800 15px/1 var(--mono); color: var(--amber); letter-spacing: .02em; }
  .d small { display: block; font: 500 9.5px/1.4 var(--mono); color: var(--dim); letter-spacing: .08em; margin-top: 3px; }
  .t { min-width: 0; position: relative; z-index: 1; }
  .t b { display: block; font: 600 14.5px/1.25 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t span { display: block; font: 500 11px/1.3 var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
  .st { font: 800 10.5px/1 var(--mono); letter-spacing: .06em; padding: 6px 7px; border-radius: 6px; background: #121414; white-space: nowrap; position: relative; z-index: 1; }
  .st.go { color: var(--green); } .st.warn { color: var(--amber); } .st.hot { color: var(--red); }
  .row .star { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); z-index: 2; }
  .empty { text-align: center; color: var(--dim); padding: 48px 24px; font-size: 14px; }
  .empty b { display: block; font: 800 15px var(--display); color: var(--text); margin-bottom: 6px; }
  .foot { text-align: center; color: #55544f; font: 500 11px var(--mono); padding: 18px 16px 0; letter-spacing: .04em; }

  @keyframes flip { from { transform: rotateX(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .row.in { animation: flip .42s cubic-bezier(.2,.8,.25,1) both; }

  /* ---------- шторка с талоном ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-height: 92vh; overflow-y: auto; background: var(--bg);
    border-radius: 18px 18px 0 0; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.25,1);
    padding: 10px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .sheet.on { transform: none; }
  .x { position: absolute; top: 6px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: var(--tile); color: var(--dim); font-size: 20px; line-height: 1; }
  .tg .x { display: none; }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: #333; margin: 2px auto 12px; }
  .full { background: var(--paper); color: var(--ink); border-radius: 14px; overflow: hidden; position: relative; }
  .full .strip { font-size: 10.5px; }
  .full .body { padding: 14px 16px 16px; }
  .full h3 { margin: 4px 0 14px; font: 800 24px/1.1 var(--display); letter-spacing: -.02em; }
  .full .route { font-size: 30px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
  .facts div { min-width: 0; }
  .facts .k { font: 500 9px var(--mono); color: var(--mute); letter-spacing: .1em; text-transform: uppercase; }
  .facts .v { font: 600 14px/1.3 var(--body); overflow-wrap: anywhere; }
  .about { margin: 14px 0 0; font-size: 14.5px; color: #3a3833; }
  .perf { position: relative; border-top: 2px dashed var(--rule); margin: 0 12px; }
  .perf::before, .perf::after { content: ""; position: absolute; top: -10px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); }
  .perf::before { left: -21px; } .perf::after { right: -21px; }
  .count { padding: 14px 16px 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: end; }
  .count .big { font-size: 64px; }
  .count .k { font: 500 9px var(--mono); color: var(--mute); letter-spacing: .1em; text-transform: uppercase; }
  .count .bars { grid-column: 1 / -1; height: 34px; margin-top: 8px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .btn { padding: 13px 12px; border-radius: 12px; background: var(--tile); font: 600 14.5px var(--body); text-align: center; text-decoration: none; color: var(--text); }
  .btn.primary { grid-column: 1 / -1; background: var(--amber); color: var(--bg); }
  .btn[aria-pressed="true"] { background: #2b2614; color: var(--amber); }
  .tg .btn.primary { display: none; } /* в Telegram регистрацию открывает системная MainButton */

  @media (prefers-reduced-motion: reduce) { .row.in { animation: none; } .sheet, .scrim { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand" id="brand" aria-label="Hack Departures"></div>
      <div class="clock" id="clock">загрузка табло…</div>
    </div>
    <button class="mine" id="mine" aria-pressed="false" title="Только отслеживаемые">Мои <b id="mineN">0</b></button>
  </header>

  <section id="hot" hidden>
    <div class="hot-head"><h2>Горит <span id="hotN"></span></h2><small>регистрация ≤ 3 дней</small></div>
    <div class="rail" id="rail"></div>
  </section>

  <div class="filters">
    <div class="seg" id="region" role="group" aria-label="Регион">
      <button data-v="ru_online" aria-pressed="true">Россия + онлайн</button>
      <button data-v="ru" aria-pressed="false">Россия</button>
      <button data-v="world" aria-pressed="false">Весь мир</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Тематика"></div>
  </div>

  <main class="board" id="board"></main>
  <div class="foot" id="foot"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Посадочный талон"><div class="grab"></div><button class="x" id="x" aria-label="Закрыть">×</button><div id="sheetBody"></div></div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
  const inTg = !!(tg && tg.platform && tg.platform !== "unknown");
  if (inTg) {
    document.documentElement.classList.add("tg");
    tg.ready(); tg.expand();
    try { tg.setHeaderColor("#0e0f0f"); tg.setBackgroundColor("#0e0f0f"); } catch (e) {}
  }
  const haptic = (kind) => { try { inTg && tg.HapticFeedback.selectionChanged(); } catch (e) {} };

  // ---------- хранилище: облако Telegram, иначе браузер ----------
  const store = {
    get(key, def) {
      return new Promise((res) => {
        if (inTg && tg.CloudStorage) {
          tg.CloudStorage.getItem(key, (err, v) => { try { res(v ? JSON.parse(v) : def); } catch (e) { res(def); } });
        } else { try { const v = localStorage.getItem(key); res(v ? JSON.parse(v) : def); } catch (e) { res(def); } }
      });
    },
    set(key, val) {
      const s = JSON.stringify(val);
      if (inTg && tg.CloudStorage) tg.CloudStorage.setItem(key, s, () => {});
      else { try { localStorage.setItem(key, s); } catch (e) {} }
    },
  };

  // ---------- даты по Москве ----------
  const MSK = "Europe/Moscow";
  const dm = new Intl.DateTimeFormat("ru-RU", { timeZone: MSK, day: "2-digit", month: "2-digit" });
  const dlong = new Intl.DateTimeFormat("ru-RU", { timeZone: MSK, day: "numeric", month: "long" });
  const wd = new Intl.DateTimeFormat("ru-RU", { timeZone: MSK, weekday: "short" });
  const mon = new Intl.DateTimeFormat("ru-RU", { timeZone: MSK, month: "long" });
  const hm = new Intl.DateTimeFormat("ru-RU", { timeZone: MSK, hour: "2-digit", minute: "2-digit" });
  const D = (s) => (s ? new Date(s) : null);
  const plural = (n, f) => f[(n % 10 === 1 && n % 100 !== 11) ? 0 : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 1 : 2];
  const left = (d, now) => {
    const ms = d - now, h = Math.floor(ms / 36e5);
    if (h < 24) return { n: Math.max(h, 1), u: plural(Math.max(h, 1), ["час", "часа", "часов"]) };
    const n = Math.floor(ms / 864e5);
    return { n, u: plural(n, ["день", "дня", "дней"]) };
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- состояние ----------
  let data = { events: [], topics: {} };
  let state = { region: "ru_online", topics: [], mine: false };
  let tracked = new Set();
  const $ = (id) => document.getElementById(id);

  const running = (e, now) => e.start && D(e.start) <= now && (!e.end || D(e.end) >= now);
  const nextMoment = (e, now) => {
    const c = [D(e.start), D(e.deadline)].filter((d) => d && d >= now);
    return c.length ? Math.min(...c) : (running(e, now) ? +now : Infinity);
  };
  // статус «посадки» (регистрации): ГОРИТ — закрывается за 3 дня, ПОСАДКА — открыта, ИДЁТ — уже стартовал
  const status = (e, now) => {
    const dl = D(e.deadline);
    if (dl && dl > now && dl - now <= 3 * 864e5) return { cls: "hot", text: "ГОРИТ" };
    if (running(e, now)) return { cls: "go", text: "ИДЁТ" };
    return { cls: "warn", text: "ПОСАДКА" };
  };
  const label = (k) => (data.topics[k] && data.topics[k].label) || k;
  const short = { ai: "AI", security: "CTF", web: "Веб", mobile: "Mobile", gamedev: "Геймдев", web3: "Web3", hardware: "Железо",
    algo: "Алгоритмы", product: "Продукт", design: "Дизайн", data: "Данные", opensource: "Open source", open: "Своб. тема",
    quantum: "Квант", fintech: "Финтех", health: "Медицина", edu: "Образование", eco: "Эко", city: "Город",
    industry: "Промышленность", gov: "Общество", retail: "Ритейл", media: "Медиа", science: "Наука",
    students: "Студентам", beginners: "Новичкам" };
  const sh = (k) => short[k] || label(k);

  // «Россия + онлайн»: российские события и международные онлайн; «Россия»: только российские
  const inRegion = (e) => state.region === "world" || e.ru || (state.region === "ru_online" && e.online === true);
  const onBoard = (e) => e.source !== "Telegram-каналы";
  const later = (e, now) => (running(e, now) && !(e.deadline && D(e.deadline) > now)) ? Infinity - 1 : nextMoment(e, now);
  function visible(now) {
    return data.events.filter((e) => {
      if (state.mine) return tracked.has(e.id);
      if (!onBoard(e) || !inRegion(e)) return false;
      if (state.topics.length && !state.topics.some((t) => e.topics.includes(t))) return false;
      return nextMoment(e, now) !== Infinity;
    }).sort((a, b) => later(a, now) - later(b, now));
  }

  // ---------- отрисовка ----------
  function barcode(code) {
    let h = 0; for (const c of code) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return `--a:${2 + (h % 3)}px;--b:${5 + (h >> 3) % 4}px`;
  }
  function route(e) {
    const s = D(e.start), f = D(e.end);
    if (!s) return `<div class="route"><span>${e.deadline ? dm.format(D(e.deadline)) : "—"}</span><span></span><span></span><small>РЕГИСТРАЦИЯ ДО</small></div>`;
    const two = f && dm.format(f) !== dm.format(s);
    return `<div class="route"><span>${dm.format(s)}</span>${two ? `<i>→</i><span>${dm.format(f)}</span>` : "<span></span><span></span>"}
            <small>СТАРТ</small>${two ? "<span></span><small>ФИНИШ</small>" : ""}</div>`;
  }
  function passCard(e, now) {
    const l = left(D(e.deadline), now);
    return `<button class="pass" data-id="${e.id}">
      <div class="strip"><span>ПОСАДОЧНЫЙ ТАЛОН</span><span>№ ${esc(e.code)}</span></div>
      <div class="main"><h3>${esc(e.title)}</h3>${route(e)}
        <div class="tags">${e.topics.slice(0, 3).map(sh).map(esc).join(" · ") || esc(e.source)}</div></div>
      <div class="stub"><div><div class="k">посадка закончится через</div><div class="big">${l.n}</div><span>${l.u}</span></div>
        <div class="bars" style="${barcode(e.code)}"></div></div>
    </button>`;
  }
  function groupName(t, now) {
    if (t === Infinity - 1) return ["УЖЕ ИДУТ", ""];
    const days = Math.floor((t - now) / 864e5);
    if (days < 7) return ["ЭТА НЕДЕЛЯ", ""];
    if (days < 14) return ["СЛЕДУЮЩАЯ НЕДЕЛЯ", ""];
    const at = new Date(t);
    const y = new Intl.DateTimeFormat("ru-RU", { timeZone: MSK, year: "numeric" }).format(at);
    const ny = new Intl.DateTimeFormat("ru-RU", { timeZone: MSK, year: "numeric" }).format(now);
    return [mon.format(at).toUpperCase() + (y !== ny ? " " + y : ""), ""];
  }
  function rowHtml(e, now, i) {
    // слева — ближайшее событие и что в этот день случится, справа — статус
    const t = nextMoment(e, now), done = t === Infinity || t === +now;
    const d = done ? (D(e.end) || D(e.start)) : new Date(t);
    const what = done ? "ФИНИШ" : (e.deadline && +D(e.deadline) === t ? "РЕГ. ДО" : "СТАРТ");
    const st = status(e, now);
    const meta = [e.online === true ? "онлайн" : e.place, ...e.topics.slice(0, 2).map(sh), e.prize].filter(Boolean).join(" · ");
    return `<button class="row in" style="animation-delay:${Math.min(i, 14) * 35}ms" data-id="${e.id}">
      <div class="d">${dm.format(d)}<small>${what}</small></div>
      <div class="t"><b>${esc(e.title)}</b><span>${esc(meta || e.source)}</span></div>
      <div class="st ${st.cls}">${st.text}</div>${tracked.has(e.id) ? '<i class="star"></i>' : ""}
    </button>`;
  }

  function render() {
    const now = new Date();
    $("clock").textContent = `ТАБЛО · ${dm.format(now)} · ${hm.format(now)} МСК`;
    $("mineN").textContent = tracked.size;
    $("mine").setAttribute("aria-pressed", state.mine);
    document.querySelectorAll("#region button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state.region));
    const list = visible(now);

    // «Горит»: регистрация закрывается в ближайшие 3 дня
    const hot = list.filter((e) => e.deadline && D(e.deadline) > now && D(e.deadline) - now <= 3 * 864e5).slice(0, 8);
    $("hot").hidden = !hot.length || state.mine;
    $("hotN").textContent = hot.length ? `· ${hot.length}` : "";
    $("rail").innerHTML = hot.map((e) => passCard(e, now)).join("");

    // табло с группами по неделям/месяцам
    let html = "", last = "", i = 0;
    for (const e of list) {
      const [g] = groupName(later(e, now), now);
      if (g !== last) { html += `<div class="group">${g}</div>`; last = g; }
      html += rowHtml(e, now, i++);
    }
    $("board").innerHTML = html || (state.mine
      ? `<div class="empty"><b>Пока ничего не отслеживаете</b>Откройте талон и нажмите «Следить» — он появится здесь. Чтобы не пропустить дедлайн, добавьте его в календарь.</div>`
      : `<div class="empty"><b>Рейсов не найдено</b>Снимите часть тем или выберите «Весь мир».</div>`);
    const gen = data.generated ? D(data.generated) : null;
    $("foot").textContent = `${list.length} ${plural(list.length, ["рейс", "рейса", "рейсов"])}` +
      (gen ? ` · обновлено ${dm.format(gen)} ${hm.format(gen)}` : "") +
      (data.failed && data.failed.length ? ` · не ответили: ${data.failed.join(", ")}` : "");
  }

  function renderChips() {
    // самые частые направления в текущем регионе
    const counts = {};
    const now = new Date();
    for (const e of data.events) {
      if (!onBoard(e) || !inRegion(e) || nextMoment(e, now) === Infinity) continue;
      for (const t of e.topics) if (t !== "open" && data.topics[t] && data.topics[t].group === "direction") counts[t] = (counts[t] || 0) + 1;
    }
    const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 9);
    $("chips").innerHTML = `<button class="chip" data-t="" aria-pressed="${!state.topics.length}">Все</button>` +
      top.map((t) => `<button class="chip" data-t="${t}" aria-pressed="${state.topics.includes(t)}">${esc(sh(t))}<em>${counts[t]}</em></button>`).join("");
  }

  // ---------- шторка ----------
  let current = null;
  function gcal(e) {
    const f = (d) => d.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    const dl = D(e.deadline), s = D(e.start);
    const at = dl && dl > new Date() ? dl : s;
    if (!at) return null;
    const end = new Date(+at + 36e5);
    const title = (at === dl ? "Дедлайн регистрации: " : "") + e.title;
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(title) +
      "&dates=" + f(at) + "/" + f(end) + "&details=" + encodeURIComponent(e.url);
  }
  function open(id) {
    const e = data.events.find((x) => x.id === id); if (!e) return;
    current = e; haptic();
    const now = new Date(), dl = D(e.deadline), on = tracked.has(e.id);
    const l = dl && dl > now ? left(dl, now) : null;
    const facts = [
      ["формат", e.online === true ? "Онлайн" : e.online === false ? "Офлайн" : "Уточняется"],
      ["где", e.place || (e.online === true ? "Из дома" : "Уточняется")],
      ["приз", e.prize || "—"],
      ["источник", e.source],
    ];
    const cal = gcal(e);
    $("sheetBody").innerHTML = `
      <div class="full">
        <div class="strip"><span>ПОСАДОЧНЫЙ ТАЛОН · ХАКАТОН</span><span>№ ${esc(e.code)}</span></div>
        <div class="body">
          <h3>${esc(e.title)}</h3>${route(e)}
          <div class="tags" style="margin-top:12px;font:800 10px/1.4 var(--mono);color:var(--spot);letter-spacing:.08em;text-transform:uppercase">${e.topics.map(sh).map(esc).join(" · ")}</div>
          <div class="facts">${facts.map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join("")}</div>
          ${e.about ? `<p class="about">${esc(e.about)}</p>` : ""}
        </div>
        <div class="perf"></div>
        <div class="count">${l ? `<div class="big">${l.n}</div><div><div class="k">${l.u} до конца регистрации</div><div style="font-weight:600">${dlong.format(dl)}, ${hm.format(dl)} МСК</div></div>`
          : `<div><div class="k">регистрация</div><div style="font-weight:600">${running(e, now) ? "идёт сейчас, срок не указан" : "срок не указан — уточните на сайте"}</div></div><div></div>`}
          <div class="bars" style="${barcode(e.code)}"></div></div>
      </div>
      <div class="actions">
        <a class="btn primary" href="${esc(e.url)}" target="_blank" rel="noopener" data-link>Регистрация и детали ↗</a>
        <button class="btn" id="trk" aria-pressed="${on}">${on ? "★ Слежу" : "☆ Следить"}</button>
        ${cal ? `<a class="btn" href="${esc(cal)}" target="_blank" rel="noopener" data-link>В календарь</a>` : `<span></span>`}
      </div>`;
    $("scrim").classList.add("on"); $("sheet").classList.add("on"); $("sheet").scrollTop = 0;
    if (inTg) {
      tg.BackButton.show();
      tg.MainButton.setParams({ text: "Регистрация и детали", color: "#ffb52e", text_color: "#0e0f0f", is_visible: true });
    }
  }
  function close() {
    $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); current = null;
    if (inTg) { tg.BackButton.hide(); tg.MainButton.hide(); }
  }
  function openLink(url) { inTg ? tg.openLink(url) : window.open(url, "_blank", "noopener"); }

  // ---------- события ----------
  document.addEventListener("click", (ev) => {
    const card = ev.target.closest("[data-id]");
    if (card && !ev.target.closest("#sheet")) return open(card.dataset.id);
    const link = ev.target.closest("[data-link]");
    if (link && inTg) { ev.preventDefault(); return openLink(link.href); }
    if (ev.target.closest("#trk") && current) {
      tracked.has(current.id) ? tracked.delete(current.id) : tracked.add(current.id);
      store.set("tracked", [...tracked]); haptic();
      const on = tracked.has(current.id), b = $("trk");
      b.setAttribute("aria-pressed", on); b.textContent = on ? "★ Слежу" : "☆ Следить";
      try { inTg && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
      return render();
    }
    const chip = ev.target.closest(".chip");
    if (chip) {
      const t = chip.dataset.t;
      state.topics = !t ? [] : state.topics.includes(t) ? state.topics.filter((x) => x !== t) : [...state.topics, t];
      store.set("state", state); haptic(); renderChips(); return render();
    }
    const seg = ev.target.closest("#region button");
    if (seg) { state.region = seg.dataset.v; store.set("state", state); haptic(); renderChips(); return render(); }
    if (ev.target.closest("#mine")) { state.mine = !state.mine; haptic(); window.scrollTo(0, 0); return render(); }
  });
  $("scrim").addEventListener("click", close);
  $("x").addEventListener("click", close);
  // свайп вниз по шторке закрывает её, если она прокручена к началу
  let y0 = null;
  $("sheet").addEventListener("touchstart", (ev) => { y0 = $("sheet").scrollTop <= 0 ? ev.touches[0].clientY : null; }, { passive: true });
  $("sheet").addEventListener("touchmove", (ev) => {
    if (y0 === null) return;
    const dy = ev.touches[0].clientY - y0;
    if (dy > 0) $("sheet").style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  $("sheet").addEventListener("touchend", (ev) => {
    if (y0 === null) return;
    const dy = ev.changedTouches[0].clientY - y0; y0 = null; $("sheet").style.transform = "";
    if (dy > 90) close();
  });
  document.addEventListener("keydown", (ev) => ev.key === "Escape" && close());
  if (inTg) {
    tg.BackButton.onClick(close);
    tg.MainButton.onClick(() => current && openLink(current.url));
  }

  // ---------- шапка из флапов ----------
  function flapTitle() {
    const word = "HACK DEPARTURES", pool = "ABCDEFGHKMNPRSTXZ0123456789";
    const el = $("brand");
    el.innerHTML = [...word].map((c) => c === " " ? '<i class="gap"></i>' : "<i></i>").join("");
    const cells = [...el.children];
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    cells.forEach((cell, i) => {
      const target = word[i]; if (target === " ") return;
      if (reduce) { cell.textContent = target; return; }
      let n = 6 + i;
      const tick = () => { cell.textContent = n-- > 0 ? pool[(Math.random() * pool.length) | 0] : target; if (n >= 0) setTimeout(tick, 45); };
      tick();
    });
  }
  flapTitle();

  // ---------- загрузка ----------
  Promise.all([
    window.HACK_DATA ? Promise.resolve(window.HACK_DATA) : fetch("data.json", { cache: "no-cache" }).then((r) => r.json()),
    store.get("state", null), store.get("tracked", []),
  ]).then(([d, s, t]) => {
    data = d; if (s) state = { ...state, ...s, mine: false }; tracked = new Set(t || []);
    renderChips(); render();
    // открыть конкретный талон по ссылке из бота: startapp=e_<id> или #e_<id>
    const p = (inTg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || location.hash.slice(1);
    if (p && p.startsWith("e_")) open(p.slice(2));
  }).catch(() => { $("board").innerHTML = `<div class="empty"><b>Табло не загрузилось</b>Проверьте соединение и откройте ещё раз.</div>`; });
})();
</script>
</body>
</html>
